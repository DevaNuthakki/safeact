# SafeAct CI: focused regression and integration checks (blueprint A11).
#
# Credentials are throwaway values generated inside each run and masked;
# no repository secrets are used. Actions are pinned to full commit SHAs,
# and container images match deploy/compose.yaml exactly.

name: ci

# One run per change: pushes to main, pull requests (which cover every
# push to a PR branch), and manual runs. Branch pushes without a PR get
# no automatic run; open a (draft) PR or use workflow_dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per PR (or per ref for main and manual runs). A newer push to
# a PR cancels its superseded run; runs on main are never cancelled, they
# queue.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.13.1"
  POSTGRES_IMAGE: postgres:17.11-bookworm
  REDIS_IMAGE: redis:7.4.2-bookworm
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  phase-a:
    name: Phase A (no services)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: >-
          python -m pip install
          -r requirements-db.lock
          -r requirements-broker.lock
          -r requirements-api.lock
          -r requirements-mcp.lock
          -r requirements-agent.lock
          -r requirements-obs.lock
          -r deploy/security/requirements-identity.txt

      - name: Phase A suite
        run: python -m unittest discover -s tests/phase_a -t . -p 'test_*.py'

  ui:
    name: Console (typecheck, lint, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc

      - name: Install pinned dependencies
        run: |
          python -m pip install -r ../requirements-db.lock -r ../requirements-broker.lock \
            -r ../requirements-api.lock -r ../requirements-mcp.lock \
            -r ../requirements-obs.lock \
            -r ../deploy/security/requirements-identity.txt
          npm ci --no-audit --no-fund

      # The committed OpenAPI schema and generated types must match the API.
      - name: API schema and types are current
        run: |
          (cd .. && python -m deploy.demo.export_openapi --check)
          npm run check:api

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit runtime dependencies (report only)
        run: npm audit --omit=dev || true

  integration:
    name: PostgreSQL + broker integration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SAFEACT_TOXIPROXY_UPSTREAM_HOST: "127.0.0.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: >-
          python -m pip install
          -r requirements-db.lock
          -r requirements-broker.lock
          -r requirements-api.lock
          -r requirements-mcp.lock
          -r requirements-agent.lock
          -r requirements-test.lock
          -r requirements-obs.lock
          -r deploy/security/requirements-identity.txt

      - name: Generate throwaway credentials and .env
        run: |
          db_password="$(openssl rand -hex 24)"
          redis_password="$(openssl rand -hex 24)"
          echo "::add-mask::${db_password}"
          echo "::add-mask::${redis_password}"
          umask 077
          {
            echo "SAFEACT_DEV_DB_PORT=55432"
            echo "SAFEACT_DEV_DB_PASSWORD=${db_password}"
            echo "SAFEACT_DEV_REDIS_PORT=56379"
            echo "SAFEACT_DEV_REDIS_PASSWORD=${redis_password}"
          } > .env
          chmod 600 .env

      # These are service containers started with `docker run` rather than
      # a `services:` block: `services:` cannot pass a container command
      # (Redis needs --requirepass), and its environment is fixed before
      # any step runs, so it cannot use credentials generated in this job.
      # Same images and the same localhost-only bindings as compose.
      - name: Start PostgreSQL and Redis containers
        run: |
          set -a; . ./.env; set +a
          docker run -d --name safeact-postgres \
            -e POSTGRES_USER=safeact_dev \
            -e POSTGRES_PASSWORD="${SAFEACT_DEV_DB_PASSWORD}" \
            -e POSTGRES_DB=safeact_dev \
            -p 127.0.0.1:55432:5432 \
            "${POSTGRES_IMAGE}"
          docker run -d --name safeact-redis \
            -e REDISCLI_AUTH="${SAFEACT_DEV_REDIS_PASSWORD}" \
            -p 127.0.0.1:56379:6379 \
            "${REDIS_IMAGE}" \
            redis-server --requirepass "${SAFEACT_DEV_REDIS_PASSWORD}" \
            --appendonly yes --appendfsync everysec
          # Linux host networking lets the proxy reach the harness's loopback
          # mock servers. The proxy API itself listens only on loopback.
          docker run -d --name safeact-toxiproxy --network host \
            ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e \
            -host=127.0.0.1
          for _ in $(seq 1 60); do
            if docker exec safeact-postgres pg_isready -U safeact_dev -d safeact_dev >/dev/null 2>&1 \
              && docker exec safeact-redis redis-cli ping 2>/dev/null | grep -q PONG \
              && curl --fail --silent http://127.0.0.1:8474/version >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs safeact-postgres
          docker logs safeact-redis
          exit 1

      - name: Migrate to head and provision the admission role
        run: |
          python -m alembic upgrade head
          docker exec -i safeact-postgres \
            psql -U safeact_dev -d safeact_dev -v ON_ERROR_STOP=1 -1 -q -f - \
            < deploy/security/provision_local_admission_role.sql

      - name: PostgreSQL + broker suite
        env:
          SAFEACT_RUN_DB_INTEGRATION: "1"
          SAFEACT_RUN_DISPOSABLE_DB_TESTS: "1"
          SAFEACT_RUN_DB_SECURITY_TESTS: "1"
          SAFEACT_RUN_BROKER_TESTS: "1"
          SAFEACT_RUN_ISOLATED_REDIS_TESTS: "1"
        run: python -m unittest discover -s tests/integration -t . -p 'test_*.py'

      # The section 07 journeys over real HTTP: uvicorn, relay, Celery
      # worker over Redis (database 14 only), reconciler and advancer.
      - name: API end-to-end journeys
        env:
          SAFEACT_RUN_API_E2E: "1"
        run: python -m unittest discover -s tests/e2e_api -t . -p 'test_*.py'

      # The agent evaluation harness end to end with scripted models only
      # (Redis database 12). CI never calls a real model: no key file and
      # no SAFEACT_ALLOW_PAID_MODEL here, and the OpenAI adapter refuses
      # to start under CI regardless.
      - name: Agent evaluation harness (scripted models, no paid calls)
        env:
          SAFEACT_RUN_AGENT_HARNESS: "1"
        run: python -m unittest discover -s tests/e2e_agent -t . -p 'test_*.py'

      # The console's journeys in a real browser against the real stack
      # (deploy/demo/e2e_server.py on Redis database 13).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc

      - name: Console browser journeys (Playwright, pinned Chromium)
        working-directory: ui
        env:
          SAFEACT_PYTHON: python
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

      # Traces (with DOM snapshots, network and console) and failure
      # screenshots for any browser test that failed: open the trace with
      # `npx playwright show-trace <trace.zip>`. Synthetic demo data only.
      - name: Upload browser test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs safeact-postgres 2>&1 | tail -200
          docker logs safeact-redis 2>&1 | tail -100

  isolated:
    name: Isolated PostgreSQL 14.23 security suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-db.lock -r requirements-obs.lock

      # The suite requires exactly PostgreSQL 14.23 binaries and runs them as
      # the unprivileged runner user. Install the exact PGDG build without
      # letting the package create or start a default cluster.
      - name: Install PostgreSQL 14.23 binaries (PGDG, exact pin)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo install -d /etc/postgresql-common
          echo "create_main_cluster = false" | sudo tee /etc/postgresql-common/createcluster.conf
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            postgresql-14=14.23-1.pgdg24.04+1 \
            postgresql-client-14=14.23-1.pgdg24.04+1
          echo "/usr/lib/postgresql/14/bin" >> "$GITHUB_PATH"

      - name: Isolated security suite
        env:
          SAFEACT_RUN_ISOLATED_CLUSTER_TESTS: "1"
        run: |
          postgres --version
          python -m unittest discover -s tests/isolated -t . -p 'test_*.py'
