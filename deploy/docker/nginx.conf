# Same-origin console and API (DEMO ONLY), as the Vite dev server does it
# (ui/vite.config.ts): the console's pages share paths with the API
# (/actions/<id>), so a browser navigation (Accept: text/html) gets the app,
# and the console's own fetch and EventSource calls go to the API on loopback.
# Host is passed through: the API compares Origin with its own scheme://host.
map $http_accept $wants_html {
    default 0;
    "~text/html" 1;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # One URL answers both a navigation (the app's HTML) and the app's own
    # fetch (JSON). Without Vary, a browser reused the cached HTML for the
    # fetch of /actions/<id> after a direct navigation there (found by a
    # headless Chromium on the Compose stack, M5.15).
    add_header Vary Accept always;

    location ~ ^/(auth|actions|grants|workflows|proposals|healthz|readyz)(/|$) {
        if ($wants_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    # The change feed (SSE): no buffering and long reads; the API ends a
    # stream itself and tells the console to reconnect.
    location = /events {
        if ($wants_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}

# The guarded MCP server binds to 127.0.0.1 only; this is its one published
# door. Host is passed through, so its DNS-rebinding check still sees
# 127.0.0.1:<port> or localhost:<port>.
server {
    listen 8002;
    server_tokens off;
    client_max_body_size 256k;

    location = /mcp {
        proxy_pass http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
