# Prometheus for the Compose stack (DEMO ONLY). Every component exports on
# 127.0.0.1 inside the stack's shared network namespace; neither the
# exporters nor Prometheus are published. Metric labels are the
# allow-listed ones the exporters set (observability/metrics.py).
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: safeact
    static_configs:
      - targets: ["127.0.0.1:9101"]
        labels: {component: api}
      - targets: ["127.0.0.1:9102"]
        labels: {component: mcp}
      - targets: ["127.0.0.1:9103"]
        labels: {component: worker}
      - targets: ["127.0.0.1:9104"]
        labels: {component: relay}
      - targets: ["127.0.0.1:9105"]
        labels: {component: reconciler}
      - targets: ["127.0.0.1:9106"]
        labels: {component: advancer}
